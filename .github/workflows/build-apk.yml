name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK file
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PixelAutoDialer-v1.0.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelAutoDialer-Debug-APK
          path: app/build/outputs/apk/debug/PixelAutoDialer-v1.0.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Pixel Auto Dialer v1.0.0"
          body: |
            ### فایل APK آماده نصب روی Google Pixel 9a
            
            - شماره‌گیری خودکار و متناوب
            - قطع خودکار تماس پس از ۲۰ ثانیه در صورت عدم پاسخ
            - روشن شدن چراغ‌قوه به محض پاسخگویی طرف مقابل
            
            روی دکمه `PixelAutoDialer-v1.0.apk` در زیر کلیک کنید تا مستقیماً روی گوشی دانلود شود.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/PixelAutoDialer-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log || exit 1

      - name: Print error if failed
        if: failure()
        run: |
          echo "=== BUILD LOG FAILURE TAIL ==="
          tail -n 100 build.log

      - name: Commit and push APK to branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout --orphan apk
          git rm -rf .
          cp app/build/outputs/apk/debug/app-debug.apk ./PixelAutoDialer.apk
          git add PixelAutoDialer.apk
          git commit -m "Add compiled APK [skip ci]"
          git push -f origin apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelAutoDialer-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

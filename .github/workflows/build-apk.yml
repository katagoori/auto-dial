name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Pixel Auto Dialer v1.0.0"
          body: "فایل APK آماده نصب برای Google Pixel 9a"
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push APK to branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/PixelAutoDialer.apk
          git checkout --orphan apk
          git rm -rf .
          cp /tmp/PixelAutoDialer.apk ./PixelAutoDialer.apk
          git add PixelAutoDialer.apk
          git commit -m "Add compiled APK [skip ci]"
          git push -f https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelAutoDialer-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
